# Free Supabase projects pause after about a week without activity. This pings the project weekly.
name: Supabase keepalive
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "SUPABASE_URL secret not set; skipping"; exit 0; fi
          curl -fsS -o /dev/null -w "%{http_code}\n" "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_ANON_KEY"
